name: evently
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.9
  animate_do: ^5.1.0
  google_fonts: ^8.2.1
  provider: ^6.1.5+1
  gap: ^3.0.1
  flutter_svg: ^2.3.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/onboard/
    - assets/icons/

